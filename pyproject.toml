[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-knowledge-ingestion"
version = "0.2.0"
description = "Local-first plugin-based knowledge ingestion for Hermes and Obsidian"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "lxml>=5,<7",
  "markdownify>=0.14,<2",
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
  "python-multipart>=0.0.18,<1",
  "PyYAML>=6,<7",
  "readability-lxml>=0.8.1,<1",
  "uvicorn[standard]>=0.34,<1",
  "youtube-transcript-api>=1,<2",
  "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
media = [
  "faster-whisper>=1.1,<2",
  "Pillow>=11,<13",
  "PyMuPDF>=1.25,<2",
  "pytesseract>=0.3.13,<1",
  "python-docx>=1.1,<2",
]
browser = ["playwright>=1.50,<2"]
hermes = ["mcp>=1,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
