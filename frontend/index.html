<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Knowledge Inbox</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#090a0c;
      --panel:#14161a;
      --panel-strong:#191c21;
      --line:#2a2e36;
      --text:#f5f6f7;
      --muted:#9299a6;
      --accent:#8b5cf6;
      --accent-strong:#7547e8;
      --success:#63d99b;
      --danger:#ff8585;
      --warning:#f2c66d;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at 50% -20%,#30224f 0,transparent 38%),
        var(--bg);
      color:var(--text);
      font:15px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    button,textarea { font:inherit; }
    button { color:inherit; }
    main { width:min(760px,calc(100% - 32px)); margin:0 auto; padding:28px 0 64px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .brand { font-weight:760; letter-spacing:-.02em; }
    .health { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:13px; }
    .health::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--warning); }
    .health.online::before { background:var(--success); box-shadow:0 0 0 4px #63d99b18; }
    .hero { padding:88px 0 28px; text-align:center; }
    .eyebrow { margin:0 0 10px; color:#b7a1f8; font-size:12px; font-weight:760; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(34px,7vw,56px); line-height:1.08; letter-spacing:-.055em; }
    .lead { max-width:560px; margin:18px auto 0; color:var(--muted); font-size:16px; }
    .composer {
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:22px;
      background:color-mix(in srgb,var(--panel) 94%,transparent);
      box-shadow:0 24px 70px #0008;
      transition:border-color .18s,box-shadow .18s,transform .18s;
    }
    .composer:focus-within,.composer.dragging { border-color:#7253bd; box-shadow:0 24px 70px #0008,0 0 0 4px #8b5cf619; }
    .composer.dragging { transform:translateY(-2px); }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    textarea {
      display:block;
      width:100%;
      min-height:168px;
      padding:24px 24px 12px;
      resize:vertical;
      border:0;
      outline:0;
      background:transparent;
      color:var(--text);
      font-size:17px;
      line-height:1.65;
    }
    textarea::placeholder { color:#747b87; }
    .attachment {
      display:none;
      align-items:center;
      gap:10px;
      width:fit-content;
      max-width:calc(100% - 48px);
      margin:0 24px 12px;
      padding:7px 8px 7px 11px;
      border:1px solid var(--line);
      border-radius:10px;
      background:#0f1114;
      color:#cdd1d8;
      font-size:13px;
    }
    .attachment.visible { display:flex; }
    .attachment-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .remove-file { width:24px; height:24px; padding:0; border:0; border-radius:7px; background:transparent; color:var(--muted); cursor:pointer; }
    .remove-file:hover { background:#252932; color:var(--text); }
    .composer-actions { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px; border-top:1px solid #22262d; }
    .attach-file {
      display:inline-flex;
      align-items:center;
      gap:8px;
      min-height:42px;
      padding:0 12px;
      border-radius:11px;
      color:var(--muted);
      cursor:pointer;
      user-select:none;
    }
    .attach-file:hover { background:#20232a; color:var(--text); }
    .attach-file svg { width:18px; height:18px; }
    .submit {
      min-height:44px;
      padding:0 18px;
      border:0;
      border-radius:12px;
      background:var(--accent);
      font-weight:760;
      cursor:pointer;
      transition:background .15s,transform .15s;
    }
    .submit:hover:not(:disabled) { background:var(--accent-strong); transform:translateY(-1px); }
    .submit:disabled { opacity:.42; cursor:not-allowed; }
    .hint { margin:13px 8px 0; color:var(--muted); text-align:center; font-size:13px; }
    .feedback { min-height:23px; margin:11px 8px 0; color:var(--success); text-align:center; font-size:13px; }
    .feedback.error { color:var(--danger); }
    .workflow {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:52px;
    }
    .workflow-card { padding:18px; border:1px solid #22262d; border-radius:16px; background:#111317a6; }
    .workflow-card strong { display:block; margin-bottom:4px; font-size:14px; }
    .workflow-card p { margin:0; color:var(--muted); font-size:13px; }
    .jobs { margin-top:44px; }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:8px; }
    h2 { margin:0; font-size:15px; }
    .section-head span { color:var(--muted); font-size:12px; }
    #jobs { display:grid; }
    .job { display:grid; grid-template-columns:82px minmax(0,1fr) auto; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid #20242a; }
    .status { font-size:11px; font-weight:800; letter-spacing:.04em; }
    .succeeded { color:var(--success); }
    .failed { color:var(--danger); }
    .running,.queued { color:var(--warning); }
    .job-title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .job-detail,.empty { color:var(--muted); font-size:12px; }
    .job-detail.error { color:#ff9b9b; white-space:normal; }
    time { color:var(--muted); font-size:12px; }
    @media(max-width:600px) {
      main { width:min(100% - 24px,760px); padding-top:18px; }
      .hero { padding:60px 0 24px; }
      .lead { font-size:15px; }
      textarea { min-height:190px; padding:20px 18px 10px; }
      .attachment { max-width:calc(100% - 36px); margin-inline:18px; }
      .attach-file span { display:none; }
      .workflow { grid-template-columns:1fr; margin-top:36px; }
      .job { grid-template-columns:72px minmax(0,1fr); }
      .job time { display:none; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand">Knowledge Inbox</div>
    <div id="health" class="health">连接中</div>
  </header>

  <section class="hero">
    <p class="eyebrow">Local-first · Obsidian</p>
    <h1>随手丢进来，<br>剩下交给系统</h1>
    <p class="lead">粘贴链接或文字，拖入视频、截图、PDF、本地文件。系统会自动识别、总结、分类、关联并写入你的知识库。</p>
  </section>

  <form id="inbox-form" class="composer">
    <label class="sr-only" for="inbox-input">要保存的链接、文字或文件</label>
    <textarea id="inbox-input" placeholder="粘贴一个链接或一段文字…" autofocus></textarea>
    <div id="attachment" class="attachment">
      <span aria-hidden="true">📎</span>
      <span id="attachment-name" class="attachment-name"></span>
      <button id="remove-file" class="remove-file" type="button" aria-label="移除文件">×</button>
    </div>
    <div class="composer-actions">
      <label class="attach-file" for="file-input" title="添加文件">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21.4 11.6 12 21a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7L9.2 18.2a2 2 0 1 1-2.8-2.8l8.5-8.5"/></svg>
        <span>添加文件</span>
      </label>
      <input id="file-input" class="sr-only" type="file">
      <button id="submit-button" class="submit" type="submit" disabled>生成知识卡片</button>
    </div>
  </form>
  <p class="hint">也可以把文件直接拖进输入框，或粘贴剪贴板里的截图</p>
  <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

  <section class="workflow" aria-label="使用方式">
    <div class="workflow-card">
      <strong>手机：直接发给你的 Agent</strong>
      <p>在 Telegram、Discord 等 IM 里转发内容，Agent 会调用同一个摄入服务自动归档。</p>
    </div>
    <div class="workflow-card">
      <strong>电脑：使用这个收件箱</strong>
      <p>现在支持粘贴和拖入；浏览器扩展会作为下一步，减少复制链接的动作。</p>
    </div>
  </section>

  <section class="jobs">
    <div class="section-head"><h2>最近生成</h2><span>自动刷新</span></div>
    <div id="jobs"></div>
  </section>
</main>

<script>
const $ = selector => document.querySelector(selector);
const input = $('#inbox-input');
const fileInput = $('#file-input');
const form = $('#inbox-form');
const submitButton = $('#submit-button');
let selectedFile = null;

const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const extractSingleUrl = value => {
  const matches = value.match(/https?:\/\/[^\s<>"']+/gi) || [];
  return matches.length === 1 ? matches[0].replace(/[.,，。)）\]]+$/, '') : null;
};

function updateComposer() {
  const attachment = $('#attachment');
  attachment.classList.toggle('visible', Boolean(selectedFile));
  $('#attachment-name').textContent = selectedFile?.name || '';
  submitButton.disabled = !selectedFile && !input.value.trim();
  input.placeholder = selectedFile ? '可选：粘贴这个文件的原始链接…' : '粘贴一个链接或一段文字…';
}

function chooseFile(file) {
  selectedFile = file || null;
  updateComposer();
}

fileInput.addEventListener('change', () => chooseFile(fileInput.files[0]));
input.addEventListener('input', updateComposer);
$('#remove-file').addEventListener('click', () => {
  fileInput.value = '';
  chooseFile(null);
});

for (const eventName of ['dragenter','dragover']) {
  form.addEventListener(eventName, event => {
    event.preventDefault();
    form.classList.add('dragging');
  });
}
for (const eventName of ['dragleave','drop']) {
  form.addEventListener(eventName, event => {
    event.preventDefault();
    form.classList.remove('dragging');
  });
}
form.addEventListener('drop', event => chooseFile(event.dataTransfer.files[0]));
input.addEventListener('paste', event => {
  const file = [...event.clipboardData.files][0];
  if (file) {
    event.preventDefault();
    chooseFile(file);
  }
});

function setFeedback(message, error = false) {
  const feedback = $('#feedback');
  feedback.textContent = message;
  feedback.classList.toggle('error', error);
}

async function submitContent() {
  const value = input.value.trim();
  let response;
  if (selectedFile) {
    const body = new FormData();
    body.append('file', selectedFile);
    const sourceUrl = extractSingleUrl(value);
    if (sourceUrl) body.append('source_url', sourceUrl);
    response = await fetch('/api/upload', {method:'POST', body});
  } else {
    const sourceUrl = extractSingleUrl(value);
    const payload = sourceUrl ? {url:sourceUrl} : {text:value};
    response = await fetch('/api/ingest', {
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify(payload),
    });
  }
  if (!response.ok) throw new Error(await response.text());
}

form.addEventListener('submit', async event => {
  event.preventDefault();
  if (submitButton.disabled) return;
  submitButton.disabled = true;
  submitButton.textContent = '正在提交…';
  setFeedback('');
  try {
    await submitContent();
    input.value = '';
    fileInput.value = '';
    selectedFile = null;
    setFeedback('已收到，正在生成知识卡片');
    await refresh();
  } catch (error) {
    setFeedback(`提交失败：${error.message}`, true);
  } finally {
    submitButton.textContent = '生成知识卡片';
    updateComposer();
  }
});

const statusLabels = {queued:'排队中',running:'处理中',succeeded:'已归档',failed:'失败'};
function jobLabel(job) {
  const value = job.payload.title || job.payload.url || job.payload.path?.split('/').pop() || job.payload.text || '文字记录';
  return value.length > 80 ? `${value.slice(0,80)}…` : value;
}

async function refresh() {
  try {
    const [health,jobs] = await Promise.all([
      fetch('/api/health').then(response => response.json()),
      fetch('/api/jobs?limit=12').then(response => response.json()),
    ]);
    $('#health').classList.add('online');
    $('#health').textContent = health.queue_size ? `处理中 ${health.queue_size}` : '服务在线';
    $('#jobs').innerHTML = jobs.length ? jobs.map(job => `
      <div class="job">
        <span class="status ${esc(job.status)}">${statusLabels[job.status] || esc(job.status)}</span>
        <div class="job-title" title="${esc(jobLabel(job))}">${esc(jobLabel(job))}${job.error ? `<div class="job-detail error">${esc(job.error)}</div>` : job.note_path ? '<div class="job-detail">已写入 Obsidian</div>' : ''}</div>
        <time>${new Date(job.created_at).toLocaleString()}</time>
      </div>`).join('') : '<p class="empty">还没有知识卡片，把第一条内容丢进来吧。</p>';
  } catch {
    $('#health').classList.remove('online');
    $('#health').textContent = '服务未连接';
  }
}

updateComposer();
refresh();
setInterval(refresh,3000);
</script>
</body>
</html>
