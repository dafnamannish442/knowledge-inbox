<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Knowledge Inbox</title>
  <style>
    :root { color-scheme: dark; --bg:#0c0d10; --panel:#15171c; --line:#292d35; --text:#f3f4f6; --muted:#959baa; --accent:#8b5cf6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 15% 0,#25203d 0,transparent 35%),var(--bg); color:var(--text); font:15px/1.5 ui-sans-serif,system-ui,-apple-system; }
    main { width:min(900px,calc(100% - 32px)); margin:48px auto; }
    header { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:24px; }
    h1 { margin:0; font-size:clamp(28px,5vw,48px); letter-spacing:-.04em; }
    .eyebrow,.muted { color:var(--muted); }
    .eyebrow { text-transform:uppercase; letter-spacing:.14em; font-size:12px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .card { background:color-mix(in srgb,var(--panel) 92%,transparent); border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:0 18px 50px #0005; }
    .wide { grid-column:1/-1; }
    label { display:block; margin-bottom:7px; font-weight:650; }
    input,textarea,button { width:100%; border:1px solid var(--line); border-radius:10px; background:#0f1116; color:var(--text); padding:11px 13px; font:inherit; }
    textarea { min-height:150px; resize:vertical; }
    button { margin-top:12px; background:var(--accent); border-color:transparent; font-weight:750; cursor:pointer; }
    button:hover { filter:brightness(1.08); }
    #jobs { display:grid; gap:8px; }
    .job { display:grid; grid-template-columns:100px 1fr auto; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); }
    .status { font-size:12px; font-weight:750; text-transform:uppercase; }
    .succeeded { color:#5ee39a; }.failed { color:#ff7777; }.running { color:#f6c85f; }
    .error { color:#ff9b9b; font-size:13px; }
    @media(max-width:680px){ .grid{grid-template-columns:1fr}.wide{grid-column:auto}.job{grid-template-columns:82px 1fr} .job time{display:none} }
  </style>
</head>
<body>
<main>
  <header>
    <div><div class="eyebrow">Hermes knowledge layer</div><h1>Knowledge Inbox</h1></div>
    <div id="health" class="muted">连接中…</div>
  </header>
  <section class="grid">
    <form id="url-form" class="card">
      <label for="url">链接</label>
      <input id="url" name="url" type="url" placeholder="网页、公众号、X、YouTube、视频号" required>
      <input name="title" placeholder="自定义标题（可选）">
      <button>开始摄入</button>
    </form>
    <form id="file-form" class="card">
      <label for="file">文件 / 视频 / 截图</label>
      <input id="file" name="file" type="file" required>
      <input name="title" placeholder="自定义标题（可选）">
      <input name="source_url" type="url" placeholder="原始来源链接（可选）">
      <button>上传并处理</button>
    </form>
    <form id="text-form" class="card wide">
      <label for="text">文字</label>
      <textarea id="text" name="text" placeholder="粘贴一段文字…" required></textarea>
      <input name="title" placeholder="自定义标题（可选）">
      <button>生成知识卡片</button>
    </form>
    <section class="card wide">
      <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">最近任务</h2><span class="muted">自动刷新</span></div>
      <div id="jobs"></div>
    </section>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
async function submitJson(form, field) {
  const data = new FormData(form), payload = {[field]: data.get(field), title: data.get('title') || undefined};
  const response = await fetch('/api/ingest', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(payload)});
  if (!response.ok) throw new Error(await response.text());
  form.reset(); await refresh();
}
$('#url-form').onsubmit = e => {e.preventDefault(); submitJson(e.target,'url').catch(alert)};
$('#text-form').onsubmit = e => {e.preventDefault(); submitJson(e.target,'text').catch(alert)};
$('#file-form').onsubmit = async e => {
  e.preventDefault();
  const response = await fetch('/api/upload',{method:'POST',body:new FormData(e.target)});
  if (!response.ok) return alert(await response.text());
  e.target.reset(); await refresh();
};
async function refresh() {
  try {
    const [health,jobs] = await Promise.all([fetch('/api/health').then(r=>r.json()),fetch('/api/jobs?limit=20').then(r=>r.json())]);
    $('#health').textContent = `在线 · 队列 ${health.queue_size} · AI ${health.ai_enabled?'开':'关'}`;
    $('#jobs').innerHTML = jobs.length ? jobs.map(job => `<div class="job"><span class="status ${esc(job.status)}">${esc(job.status)}</span><div><div>${esc(job.payload.title || job.payload.url || job.payload.path?.split('/').pop() || '文字记录')}</div>${job.error?`<div class="error">${esc(job.error)}</div>`:''}</div><time class="muted">${new Date(job.created_at).toLocaleString()}</time></div>`).join('') : '<p class="muted">还没有任务</p>';
  } catch { $('#health').textContent='连接失败'; }
}
refresh(); setInterval(refresh,3000);
</script>
</body>
</html>
